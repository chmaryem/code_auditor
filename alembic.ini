# alembic.ini — Alembic configuration for Code Auditor AI
[alembic]
script_location = migrations
prepend_sys_path = .

# Use DATABASE_SYNC_URL env var at runtime; this is the fallback default.
sqlalchemy.url = postgresql+psycopg2://codeauditor:codeauditor@localhost:5432/codeauditor

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
